<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="css/grid.css">
</head>

<body>

    <div class="grid-container">
        <header class="header">
            <h1>SHOP-GRID</h1>
            <nav>Home | Categories | Contact</nav>
        </header>

        <section class="hero">
            <div class="hero-featured">
                <h2>Siêu Sale Mùa Hè</h2>
                <p>Giảm giá lên đến 50% cho các mặt hàng điện tử.</p>
            </div>
            <div class="hero-item-special">
                <p>Sản phẩm nổi bật</p>
            </div>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <div class="filter-group">
                <h4>Danh mục</h4>
                <label><input type="checkbox"> Điện tử</label><br>
                <label><input type="checkbox"> Thời trang</label><br>
                <label><input type="checkbox"> Gia dụng</label>
            </div>
            <div class="filter-group">
                <h4>Mức giá</h4>
                <label><input type="checkbox"> Dưới 1 triệu</label><br>
                <label><input type="checkbox"> 1 - 5 triệu</label>
            </div>
        </aside>

        <main class="main-content">
            <div class="product-grid">
                <div class="product-card">Card 1</div>
                <div class="product-card">Card 2</div>
                <div class="product-card">Card 3</div>
                <div class="product-card">Card 4</div>
                <div class="product-card">Card 5</div>
                <div class="product-card">Card 6</div>
            </div>
        </main>

        <aside class="ads">
            <img src="https://via.placeholder.com/180x400?text=Quảng+Cáo" alt="Banner Ads">
            <p>Quảng cáo hấp dẫn tại đây!</p>
        </aside>

        <footer class="footer">
            <p>&copy; 2026 E-Commerce Store. All rights reserved.</p>
        </footer>
    </div>

</body>

</html>
