<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navigation & Cards</title>
    <link rel="stylesheet" href="css/flexbox.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">MYLOGO</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
        </ul>

        <div class="auth-buttons">
            <button class="btn-login">Login</button>
            <button class="btn-register">Register</button>
        </div>
    </nav>

    <div class="container">
        <h1 style="text-align: center; margin: 30px 0;">Sản phẩm mới nhất</h1>

        <div class="product-grid">
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product" class="card-img">
                <div class="card-body">
                    <h3 class="product-name">iPhone 15 Pro</h3>
                    <p class="product-price">28.990.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product" class="card-img">
                <div class="card-body">
                    <h3 class="product-name">MacBook Air M2</h3>
                    <p class="product-price">24.500.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            <div class="card"><img src="https://via.placeholder.com/250x150" class="card-img">
                <div class="card-body">
                    <h3>Sản phẩm 3</h3>
                    <p>1.000.000đ</p><button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            <div class="card"><img src="https://via.placeholder.com/250x150" class="card-img">
                <div class="card-body">
                    <h3>Sản phẩm 4</h3>
                    <p>2.000.000đ</p><button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            <div class="card"><img src="https://via.placeholder.com/250x150" class="card-img">
                <div class="card-body">
                    <h3>Sản phẩm 5</h3>
                    <p>3.000.000đ</p><button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            <div class="card"><img src="https://via.placeholder.com/250x150" class="card-img">
                <div class="card-body">
                    <h3>Sản phẩm 6</h3>
                    <p>4.000.000đ</p><button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            <div class="card"><img src="https://via.placeholder.com/250x150" class="card-img">
                <div class="card-body">
                    <h3>Sản phẩm 7</h3>
                    <p>5.000.000đ</p><button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            <div class="card"><img src="https://via.placeholder.com/250x150" class="card-img">
                <div class="card-body">
                    <h3>Sản phẩm 8</h3>
                    <p>6.000.000đ</p><button class="btn-buy">Mua ngay</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
