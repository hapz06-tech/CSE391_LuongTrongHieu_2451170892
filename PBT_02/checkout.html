<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán</title>
</head>
<body>
    <h1>Trang Thanh Toán</h1>
    <form action="#" method="POST">>
        <fieldset>
            <legend>1. Giỏ hàng của bạn</legend>
            <table border="1" width="100%">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>iPhone 16 Pro Max</td>
                        <td>30.000.000đ</td>
                        <td>1</td>
                        <td>30.000.000đ</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>iPhone 16 Pro</td>
                        <td>25.000.000đ</td>
                        <td>1</td>
                        <td>25.000.000đ</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Tai nghe</td>
                        <td>1.000.000đ</td>
                        <td>2</td>
                        <td>2.000.000đ</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4" align="right"><strong>Tổng cộng:</strong></td>
                        <td><output name="total">57.000.000đ</output></td>
                    </tr>
                </tfoot>
            </table>
        </fieldset>

        <fieldset>
            <legend>2. Hình thức thanh toán</legend>
            <input type="radio" id="pay_cod" name="payment" value="cod" checked> <label for="pay_cod">Thanh toán khi nhận hàng (COD)</label><br>
            <input type="radio" id="pay_transfer" name="payment" value="transfer"> <label for="pay_transfer">Chuyển khoản</label><br>
            <input type="radio" id="pay_wallet" name="payment" value="wallet"> <label for="pay_wallet">Ví điện tử</label><br><br>

            <label for="coupon">Mã giảm giá:</label>
            <input type="text" id="coupon" name="coupon" pattern="SALE\d{4}" placeholder="Vd: SALE2026"><br><br>

            <label for="note">Ghi chú đơn hàng:</label>
            <textarea id="note" name="note" rows="3"></textarea>
        </fieldset>

        <fieldset>
            <legend>3. Thời gian giao hàng</legend>
            <label for="delivery_date">Ngày nhận mong muốn:</label>
            <input type="date" id="delivery_date" name="delivery_date" min="2026-04-25"><br><br>

            <label for="time_slot">Khung giờ:</label>
            <select id="time_slot" name="time_slot">
                <option value="s">Sáng (8h - 12h)</option>
                <option value="c">Chiều (14h - 18h)</option>
                <option value="t">Tối (18h - 21h)</option>
            </select><br><br>

            <label for="duration">Chấp nhận giao chậm (số ngày):</label>
            <input type="range" id="duration" name="duration" min="1" max="7" step="1" value="3">
        </fieldset><br>

        <button type="submit" aria-label="Xác nhận đặt hàng">Xác nhận đặt hàng</button>
    </form>
</body>
</html>
